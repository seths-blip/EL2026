<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evmux Countdown Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Adjust this single value to scale both the label and timer together */
            --text-size: 1.65rem; 
            
            /* Box styling */
            --box-bg: rgba(22, 26, 36, 0.88);       /* Dark slate tint visible against pure black */
            --box-border: rgba(255, 255, 255, 0.22); /* Clean border defining the rounded card */
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            box-sizing: border-box;
        }

        .widget-container {
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 16px;
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        #label {
            font-size: var(--text-size);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        #timer {
            font-size: var(--text-size);
            font-weight: 700;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="widget-container">
        <div id="label">Game Day begins in</div>
        <div id="timer">00:00:00</div>
    </div>

    <script>
        // November 13, 2026, 12:00 PM PST (UTC-8)
        const targetDate = new Date("2026-11-13T12:00:00-08:00").getTime();
        
        const labelEl = document.getElementById("label");
        const timerEl = document.getElementById("timer");

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const isCountingUp = distance < 0;
            const absDistance = Math.abs(distance);

            const days = Math.floor(absDistance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((absDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((absDistance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((absDistance % (1000 * 60)) / 1000);

            const pad = (num) => num.toString().padStart(2, '0');
            
            // Format: DD:HH:MM:SS when days remain, otherwise HH:MM:SS
            let timeString = "";
            if (days > 0) {
                timeString += `${pad(days)}:`;
            }
            timeString += `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

            timerEl.innerText = timeString;
            labelEl.innerText = isCountingUp ? "Quest Timer" : "Game Day begins in";
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
